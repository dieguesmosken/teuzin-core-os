# Teuzin Core OS - Milestone 2: LTS kernel base image build (DRAFT, manual only).
# Builds Debian 13 minimal + kernel 6.18 (BRANCH=current) for BigTreeTech CB1 / BTT Pi V1.2
# from bigtreetech/build pinned by commit SHA. Produces artifacts only; it never flashes media.
name: build-image-lts

on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: 'Pin kernel to this stable tag, e.g. v6.18.34 (empty = rolling linux-6.18.y branch, known to break patches)'
        required: false
        default: 'v6.18.38'

permissions:
  contents: read

env:
  BUILD_REPO: https://github.com/bigtreetech/build.git
  BUILD_SHA: 555de9b208cb136b26a9c9d2d40aec952abbc444   # bpi-main-26.08.0, checked 2026-11-22

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Record runner
        run: |
          nproc; free -g; df -h /
          echo "build repo: $BUILD_REPO @ $BUILD_SHA"

      - name: Free disk space (ephemeral runner only)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Enable arm64 emulation on the runner
        run: |
          # The build's Docker container needs qemu handlers registered in the host kernel
          # (binfmt_misc); registering them from inside the container failed on the first run.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
          ls /proc/sys/fs/binfmt_misc/
          grep -H . /proc/sys/fs/binfmt_misc/qemu-aarch64 | head -5

      - uses: actions/checkout@v4

      - name: Fetch pinned build system
        run: |
          git clone --no-checkout "$BUILD_REPO" build
          git -C build checkout --detach "$BUILD_SHA"
          test "$(git -C build rev-parse HEAD)" = "$BUILD_SHA"

      - name: Install Teuzin build extension (userpatches)
        run: |
          mkdir -p build/userpatches/extensions
          cp ci/userpatches/extensions/teuzin-ifupdown.sh build/userpatches/extensions/

      - name: Build image
        working-directory: build
        shell: bash   # GitHub's 'bash' adds -eo pipefail, so a compile.sh failure is not hidden by tee
        env:
          KERNEL_TAG: ${{ inputs.kernel_tag }}
        run: |
          KERNEL_PIN=()
          if [ -n "$KERNEL_TAG" ]; then
            [[ "$KERNEL_TAG" =~ ^v6\.18\.[0-9]+$ ]] || { echo "invalid kernel_tag: $KERNEL_TAG"; exit 1; }
            KERNEL_PIN=("KERNELBRANCH=tag:$KERNEL_TAG")
          fi
          echo "kernel pin: ${KERNEL_PIN[*]:-none (rolling)}"
          ./compile.sh build \
            BOARD=bigtreetech-cb1 BRANCH=current RELEASE=trixie "${KERNEL_PIN[@]}" \
            BUILD_MINIMAL=yes BUILD_DESKTOP=no KERNEL_CONFIGURE=no \
            ENABLE_EXTENSIONS=teuzin-ifupdown \
            COMPRESS_OUTPUTIMAGE=sha,img \
            2>&1 | tee ../build.log

      - name: Compress image (GitHub release assets are limited to 2 GiB per file)
        run: |
          cd build/output/images
          for f in *.img; do xz -T0 -6 -c "$f" > "$f.xz" && rm -f "$f"; done
          ls -lh

      - name: Collect checksums and versions
        env:
          KERNEL_TAG: ${{ inputs.kernel_tag }}
        run: |
          cd build/output/images
          ls -lh
          sha256sum *.img.xz > ../../../SHA256SUMS-images.txt
          echo "build_sha=$BUILD_SHA" > ../../../UPSTREAM-used.txt
          echo "kernel_tag=${KERNEL_TAG:-rolling}" >> ../../../UPSTREAM-used.txt
          date -u +%FT%TZ >> ../../../UPSTREAM-used.txt

      - uses: actions/upload-artifact@v4
        with:
          name: teuzin-core-os-lts-image
          path: |
            build/output/images/*.img.xz
            build/output/images/*.img.txt
            build.log
            SHA256SUMS-images.txt
            UPSTREAM-used.txt
          retention-days: 14

  release:
    # Every successful build is published as a PRE-RELEASE (untested).
    # Promotion to a normal release is done only by the owner, via promote-release.yml.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      KERNEL_TAG: ${{ inputs.kernel_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: teuzin-core-os-lts-image
          path: assets

      - name: Create pre-release
        run: |
          set -euo pipefail
          K="${KERNEL_TAG:-rolling}"
          TAG="base-lts-${K#v}-r${{ github.run_number }}"
          ls -lh assets
          cat > notes.md <<EOF
          **PRE-RELEASE - NOT TESTED ON HARDWARE.** Built by CI and never booted on a BTT Pi V1.2. Do not use on the production card.

          - Base: Debian 13 (trixie) minimal, kernel ${K} (LTS 6.18 series), board bigtreetech-cb1
          - Build system: bigtreetech/build pinned at commit 555de9b208cb136b26a9c9d2d40aec952abbc444 (no BTT source modified; Teuzin extension in ci/userpatches/extensions)
          - Built from this repository at ${GITHUB_SHA}, CI run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Verify before flashing: sha256sum -c SHA256SUMS-images.txt
          - Image is xz-compressed. Flash only to a NEW microSD, never the old recovery card.
          - The image contains software under several licenses (mostly GPL); the build recipe and sources are those referenced above.

          Promoted to a normal release only after the owner confirms it was tested.
          EOF
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Teuzin Core OS base (LTS ${K}) - build ${{ github.run_number }} [pre-release, untested]" \
            --notes-file notes.md --prerelease
          echo "Release tag: $TAG" >> "$GITHUB_STEP_SUMMARY"
